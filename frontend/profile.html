<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Profile - CookZenix AI</title>
  <meta name="description" content="View your profile, manage your recipes, and see your saved favourites on CookZenix AI." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link rel="stylesheet" href="css/style.css" />
  <style>
    /* ── Profile Page Styles ── */
    .profile-page { padding-top: 80px; min-height: 100vh; background: var(--bg-darkest); }

    /* Banner */
    .profile-banner {
      height: 220px;
      background: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
      position: relative; overflow: hidden;
    }
    .profile-banner::before {
      content: '🍕 🍝 🍣 🍛 🍰 🥗 🍔 🌮 🍜 🥘';
      position: absolute; font-size: 2.5rem; color: rgba(255,255,255,0.06);
      white-space: pre; letter-spacing: 30px; top: 50%; left: 50%;
      transform: translate(-50%, -50%); width: 200%; text-align: center;
    }

    /* Profile Header */
    .profile-header {
      max-width: 1100px; margin: 0 auto;
      padding: 0 var(--space-6) var(--space-8);
      position: relative;
    }
    .profile-header-inner {
      display: flex; align-items: flex-end; gap: var(--space-6);
      margin-top: -70px; flex-wrap: wrap;
    }
    .profile-avatar-wrap { position: relative; flex-shrink: 0; }
    #profile-avatar {
      width: 130px; height: 130px; border-radius: 50%;
      background: var(--gradient-primary);
      border: 4px solid var(--bg-darkest);
      display: flex; align-items: center; justify-content: center;
      font-size: 3.5rem; font-weight: 800; color: white;
      font-family: var(--font-heading);
      box-shadow: 0 0 40px rgba(255,107,53,0.4);
    }
    .profile-badge {
      position: absolute; bottom: 6px; right: 6px;
      width: 32px; height: 32px; border-radius: 50%;
      background: var(--success); border: 3px solid var(--bg-darkest);
      display: flex; align-items: center; justify-content: center;
      font-size: 0.85rem;
    }
    .profile-info { flex: 1; padding-bottom: var(--space-3); min-width: 200px; }
    #profile-username { font-family: var(--font-heading); font-size: clamp(1.5rem, 3vw, 2rem); color: var(--text-primary); margin: 0 0 var(--space-1); }
    #profile-bio { color: var(--text-secondary); font-size: 0.95rem; margin: 0 0 var(--space-4); max-width: 500px; }
    .profile-stats { display: flex; gap: var(--space-6); flex-wrap: wrap; }
    .stat-item { text-align: center; }
    .stat-num { font-size: 1.6rem; font-weight: 800; color: var(--primary); display: block; font-family: var(--font-heading); }
    .stat-label { font-size: 0.8rem; color: var(--text-muted); font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; }
    .profile-actions { display: flex; gap: var(--space-3); align-items: center; padding-bottom: var(--space-3); margin-left: auto; }
    @media (max-width: 640px) { .profile-actions { margin-left: 0; width: 100%; } }

    /* Tabs */
    .profile-tabs {
      max-width: 1100px; margin: 0 auto;
      padding: 0 var(--space-6); border-bottom: 1px solid var(--glass-border);
      display: flex; gap: 0;
    }
    .profile-tab {
      padding: var(--space-4) var(--space-6); font-weight: 700; font-size: 0.95rem;
      color: var(--text-muted); cursor: pointer; border: none;
      background: transparent; position: relative; transition: color 0.3s;
    }
    .profile-tab::after {
      content: ''; position: absolute; bottom: -1px; left: 0; right: 0;
      height: 2px; background: var(--gradient-primary);
      transform: scaleX(0); transition: transform 0.3s ease;
    }
    .profile-tab.active { color: var(--primary); }
    .profile-tab.active::after { transform: scaleX(1); }
    .profile-tab:hover { color: var(--text-primary); }

    /* Panels */
    .profile-content { max-width: 1100px; margin: 0 auto; padding: var(--space-8) var(--space-6); }
    .profile-panel { display: none; animation: fadeIn 0.4s ease; }
    .profile-panel.active { display: block; }

    /* Grid */
    .profile-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: var(--space-6); }

    /* Empty State */
    .empty-state-full {
      text-align: center; padding: var(--space-16) var(--space-4);
      color: var(--text-secondary);
    }
    .empty-state-full h3 { font-family: var(--font-heading); font-size: 1.4rem; color: var(--text-primary); margin: var(--space-3) 0 var(--space-2); }
    .empty-state-full p { margin-bottom: var(--space-5); }

    /* Modal */
    .modal-overlay {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,0.75); z-index: 1000;
      backdrop-filter: blur(6px);
      align-items: center; justify-content: center;
    }
    .modal-overlay.active { display: flex; }
    .modal-card {
      background: var(--bg-card); border: 1px solid var(--glass-border);
      border-radius: var(--radius-xl); padding: var(--space-8);
      max-width: 480px; width: 90%; animation: slideUp 0.3s ease;
    }
    .modal-card h3 { font-family: var(--font-heading); font-size: 1.4rem; color: var(--text-primary); margin-bottom: var(--space-6); }
    .form-group { margin-bottom: var(--space-5); }
    .form-label { display: block; color: var(--text-secondary); font-size: 0.9rem; font-weight: 600; margin-bottom: var(--space-2); }
    .form-input, .form-textarea {
      width: 100%; padding: 13px 16px;
      background: rgba(255,255,255,0.04); border: 1.5px solid var(--glass-border);
      border-radius: var(--radius-md); color: var(--text-primary);
      font-family: var(--font-body); font-size: 0.95rem; transition: all 0.3s; outline: none;
    }
    .form-input:focus, .form-textarea:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(255,107,53,0.15); }
    .form-textarea { resize: vertical; min-height: 80px; }
    .modal-footer { display: flex; gap: var(--space-3); justify-content: flex-end; margin-top: var(--space-6); }
    .btn { display: inline-flex; align-items: center; justify-content: center; gap: var(--space-2); padding: 11px 24px; border-radius: var(--radius-full); font-family: var(--font-body); font-size: 0.9rem; font-weight: 700; cursor: pointer; border: none; transition: all 0.3s; text-decoration: none; }
    .btn-primary { background: var(--gradient-primary); color: white; box-shadow: 0 4px 20px rgba(255,107,53,0.35); }
    .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 8px 30px rgba(255,107,53,0.5); }
    .btn-ghost { background: transparent; border: 1.5px solid var(--glass-border); color: var(--text-secondary); }
    .btn-ghost:hover { border-color: var(--primary); color: var(--primary); }
    .btn-sm { padding: 8px 18px; font-size: 0.85rem; }
    .btn:disabled { opacity: 0.55; cursor: not-allowed; }
    .spinner { width: 16px; height: 16px; border: 2px solid rgba(255,255,255,0.3); border-top-color: white; border-radius: 50%; animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

    /* Card owner actions */
    .card-owner-actions { display: flex; gap: var(--space-2); margin-left: auto; }
    .btn-icon { width: 32px; height: 32px; border-radius: 50%; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 0.9rem; transition: all 0.2s; }
    .btn-edit { background: rgba(78,205,196,0.12); }
    .btn-edit:hover { background: rgba(78,205,196,0.25); transform: scale(1.1); }
    .btn-delete { background: rgba(255,68,68,0.1); }
    .btn-delete:hover { background: rgba(255,68,68,0.25); transform: scale(1.1); }

    /* Skeleton */
    .skeleton { background: linear-gradient(90deg, rgba(255,255,255,0.04) 25%, rgba(255,255,255,0.08) 50%, rgba(255,255,255,0.04) 75%); background-size: 200% 100%; animation: shimmer 1.5s infinite; border-radius: var(--radius-md); }
    @keyframes shimmer { 0% { background-position: -200% 0; } 100% { background-position: 200% 0; } }
  </style>
</head>
<body>
  <!-- Navbar -->
  <nav class="navbar" id="navbar">
    <div class="navbar-container">
      <a href="index.html" class="navbar-logo">
        <span class="logo-icon">🍴</span>
        <span class="logo-text">CookZenix <em>AI</em></span>
      </a>
      <button class="hamburger" id="hamburger" aria-label="Toggle navigation">
        <span></span><span></span><span></span>
      </button>
      <ul class="nav-menu" id="nav-menu">
        <li><a href="index.html" class="nav-link">Home</a></li>
        <li><a href="recipes.html" class="nav-link">Recipes</a></li>
        <li><a href="recipes.html" class="nav-link">Categories</a></li>
        <li><a href="add-recipe.html" class="nav-link" id="add-recipe-link">Add Recipe</a></li>
      </ul>
      <div class="nav-auth" id="auth-nav">
        <a href="signin.html" class="btn btn-signin" id="nav-signin">Sign In</a>
        <a href="signup.html" class="btn btn-signup" id="nav-signup">Sign Up</a>
      </div>
    </div>
  </nav>

  <main class="profile-page">
    <!-- Banner -->
    <div class="profile-banner"></div>

    <!-- Profile Header -->
    <div class="profile-header">
      <div class="profile-header-inner">
        <div class="profile-avatar-wrap">
          <div id="profile-avatar">C</div>
          <div class="profile-badge">👨‍🍳</div>
        </div>
        <div class="profile-info">
          <h1 id="profile-username">Loading...</h1>
          <p id="profile-bio">Food enthusiast &amp; recipe explorer 🍽️</p>
          <div class="profile-stats">
            <div class="stat-item">
              <span class="stat-num" id="stat-recipes">0</span>
              <span class="stat-label">Recipes</span>
            </div>
            <div class="stat-item">
              <span class="stat-num" id="stat-favorites">0</span>
              <span class="stat-label">Favorites</span>
            </div>
            <div class="stat-item">
              <span class="stat-num" id="stat-joined">—</span>
              <span class="stat-label">Joined</span>
            </div>
          </div>
        </div>
        <div class="profile-actions">
          <button class="btn btn-ghost btn-sm" id="edit-profile-btn">
            <i class="fa fa-pen"></i> Edit Profile
          </button>
          <a href="add-recipe.html" class="btn btn-primary btn-sm">
            <i class="fa fa-plus"></i> Add Recipe
          </a>
        </div>
      </div>
    </div>

    <!-- Tabs -->
    <div class="profile-tabs">
      <button class="profile-tab active" id="tab-my-recipes" data-panel="my-recipes-panel">
        <i class="fa fa-utensils"></i> My Recipes
      </button>
      <button class="profile-tab" id="tab-favorites" data-panel="favorites-panel">
        <i class="fa fa-heart"></i> Favorites
      </button>
    </div>

    <!-- Content -->
    <div class="profile-content">
      <!-- My Recipes -->
      <div class="profile-panel active" id="my-recipes-panel">
        <div class="profile-grid" id="my-recipes-grid">
          <!-- Populated by JS -->
        </div>
      </div>

      <!-- Favorites -->
      <div class="profile-panel" id="favorites-panel">
        <div class="profile-grid" id="favorites-grid">
          <!-- Populated by JS -->
        </div>
      </div>
    </div>
  </main>

  <!-- Edit Profile Modal -->
  <div class="modal-overlay" id="edit-modal">
    <div class="modal-card">
      <h3>✏️ Edit Profile</h3>
      <div class="form-group">
        <label class="form-label" for="edit-username">Username</label>
        <input type="text" id="edit-username" class="form-input" placeholder="Your username" />
      </div>
      <div class="form-group">
        <label class="form-label" for="edit-bio">Bio</label>
        <textarea id="edit-bio" class="form-textarea" rows="3" placeholder="Tell the world about your cooking style..."></textarea>
      </div>
      <div class="form-group">
        <label class="form-label" for="edit-avatar">Avatar URL <span style="font-size:0.75rem;color:var(--text-muted)">(optional)</span></label>
        <input type="url" id="edit-avatar" class="form-input" placeholder="https://..." />
      </div>
      <div class="modal-footer">
        <button class="btn btn-ghost" id="edit-cancel">Cancel</button>
        <button class="btn btn-primary" id="edit-save">
          <i class="fa fa-check"></i> Save Changes
        </button>
      </div>
    </div>
  </div>

  <!-- FoodieBot Chatbot Widget -->
  <div class="chatbot-widget" id="chatbot-widget">
    <div class="chatbot-panel" id="chatbot-panel">
      <div class="chatbot-header">
        <div class="chatbot-header-info">
          <span class="chatbot-avatar">🤖</span>
          <div>
            <h4>FoodieBot</h4>
            <span class="status-dot"></span><span class="status-text">Always ready to cook!</span>
          </div>
        </div>
        <button class="chatbot-close" id="chatbot-close">✕</button>
      </div>
      <div class="chatbot-messages" id="chatbot-messages"></div>
      <div class="chatbot-input-area">
        <input type="text" id="chatbot-input" placeholder="Ask me anything about food..." />
        <button id="chatbot-send">➤</button>
      </div>
    </div>
    <button class="chatbot-toggle" id="chatbot-toggle" title="Chat with FoodieBot">🍴</button>
  </div>

  <script src="js/main.js"></script>
  <script src="js/profile.js"></script>
  <script src="js/chatbot.js"></script>
</body>
</html>
